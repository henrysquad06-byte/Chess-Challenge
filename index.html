<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Challenge — Play vs Bot</title>

    <!-- chessboard.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />

    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; padding: 20px; }
      #board { width: 480px; margin-bottom: 12px; }
      #controls { margin-top: 8px; }
      #status { margin-top: 8px; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Chess Challenge — You (White) vs Bot (Black)</h1>

    <div id="board"></div>

    <div id="controls">
      <button id="resetBtn">Reset</button>
      <button id="undoBtn">Undo (take back)</button>
    </div>

    <div id="status">Status: ready</div>

    <!-- jQuery (required by chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- chessboard.js and chess.js (game logic) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>

    <script>
      // The game logic: chess.js
      var game = new Chess();

      // chessboard.js config
      var board = null;
      var cfg = {
        draggable: true,
        position: 'start',
        orientation: 'white', // user is white
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      };

      board = Chessboard('board', cfg);

      function onDragStart(source, piece, position, orientation) {
        // do not pick up pieces if the game is over
        if (game.game_over()) return false;

        // only allow the user to move white pieces and only on white's turn
        if (piece.search(/^b/) !== -1) return false;
        if (game.turn() !== 'w') return false;
      }

      function onDrop(source, target, piece, newPos, oldPos, orientation) {
        // see if the move is legal
        var move = game.move({ from: source, to: target, promotion: 'q' }); // always promote to queen for simplicity

        // illegal move
        if (move === null) return 'snapback';

        updateStatus();

        // let the board reflect the move (snap will be called soon)
        window.setTimeout(function() {
          makeBotMove();
        }, 250);
      }

      function onSnapEnd() {
        board.position(game.fen());
      }

      function makeBotMove() {
        if (game.game_over()) return;

        // get all legal moves for black
        var moves = game.moves();
        if (moves.length === 0) return;

        // simple bot: pick a random legal move
        var move = moves[Math.floor(Math.random() * moves.length)];
        game.move(move);

        board.position(game.fen());
        updateStatus();
      }

      function updateStatus() {
        var status = '';

        var moveColor = (game.turn() === 'w') ? 'White' : 'Black';

        // checkmate
        if (game.in_checkmate()) {
          status = 'Game over, ' + (moveColor === 'White' ? 'Black' : 'White') + ' wins by checkmate.';
        }
        // draw
        else if (game.in_draw()) {
          status = 'Game over, drawn position.';
        }
        else {
          status = moveColor + ' to move';
          if (game.in_check()) {
            status += ', ' + moveColor + ' is in check';
          }
        }

        document.getElementById('status').textContent = 'Status: ' + status;
      }

      // controls
      document.getElementById('resetBtn').addEventListener('click', function() {
        game.reset();
        board.start();
        updateStatus();
      });

      document.getElementById('undoBtn').addEventListener('click', function() {
        // undo two half-moves so it's back to the user's turn
        game.undo();
        game.undo();
        board.position(game.fen());
        updateStatus();
      });

      // initialize status
      updateStatus();

      // If you want the bot to start as black after a page load when user chooses to play Black, you'd set orientation: 'black' and trigger a bot move.
    </script>
  </body>
</html>
